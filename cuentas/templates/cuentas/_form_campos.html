{% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{% for e in form.non_field_errors %}{{ e }} {% endfor %}</div>{% endif %}
{% for campo in form %}
<div class="mb-3">
    <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% for e in campo.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
    {% if campo.help_text %}<div class="form-text small">{{ campo.help_text|safe }}</div>{% endif %}
</div>
{% endfor %}
