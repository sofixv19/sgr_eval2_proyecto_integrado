# Estándar de codificación del proyecto (PEP 8 revisado con flake8).
# Uso: flake8
[flake8]
max-line-length = 130
exclude = .git,__pycache__,migrations,venv,staticfiles
# Tablas de datos de prueba (textos largos) en el generador del protocolo.
per-file-ignores = docs/pruebas/generar_protocolo.py:E501
